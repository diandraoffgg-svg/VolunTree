<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>VolunTree - Login Test</title>
</head>
<body>

    <h1>VolunTree</h1>
    <p>Google Authentication Test</p>

    <button id="login-btn">
        Sign in with Google
    </button>

    <section id="user-info" hidden>

        <h2>Login Berhasil!</h2>

        <img id="user-avatar"
             width="80"
             alt="Profile Picture">

        <p id="user-name"></p>
        <p id="user-email"></p>

        <button id="logout-btn">
            Logout
        </button>

    </section>

    <script type="module"
            src="../js/auth.js"></script>

</body>
</html>
